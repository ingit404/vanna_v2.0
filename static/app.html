<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rupeek Explorer AI - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary-gold: #FFD700;
            --accent-blue: #3b82f6;
            --bg-dark: #05070a;
            --sidebar-bg: #0a0a0a;
            --glass-bg: rgba(15, 23, 42, 0.6);
            --border-glass: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            color: white;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 300px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border-glass);
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
        }

        .profile-section {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-glass);
        }

        .user-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-blue), var(--primary-gold));
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.35);
            border: 2px solid var(--primary-gold);
            flex-shrink: 0;
            font-weight: 700;
            font-size: 1.2rem;
            color: white;
        }

        .user-details {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #user-email-display {
            font-size: 0.85rem;
            color: #f8fafc;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .logout-link {
            font-size: 0.75rem;
            color: var(--primary-gold);
            text-decoration: none;
            margin-top: 2px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-new-analysis {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-bottom: 2rem;
        }

        .history-label {
            color: #444;
            font-size: 0.7rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        #history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-item {
            font-size: 0.85rem;
            padding: 10px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid transparent;
            color: #94a3b8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
            transition: 0.2s;
        }

        .history-item:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: var(--border-glass);
            color: white;
        }

        /* --- MAIN CONTENT --- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            background-image: radial-gradient(circle at top right, rgba(255, 215, 0, 0.07), transparent);
        }

        .main-header {
            display: flex;
            justify-content: flex-end;
            padding: 1.5rem 2rem 0.5rem;
            width: 100%;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .rupeek-logo {
            height: 32px;
            width: auto;
            display: block;
            object-fit: contain;
        }

        #conversation-container {
            flex: 1;
            overflow-y: auto;
            padding: 0 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            scroll-behavior: smooth;
        }

        .welcome-box {
            margin: 1.5rem auto 0;
            width: 85%;
            max-width: 850px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            padding: 1.5rem 2.5rem;
            border-radius: 16px;
            border-left: 4px solid var(--primary-gold);
            flex-shrink: 0;
        }

        .welcome-box h1 {
            margin: 0 0 5px;
            font-size: 1.5rem;
            background: linear-gradient(to right, #fff, var(--primary-gold));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .results-section {
            margin: 0 auto;
            width: 85%;
            max-width: 850px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            padding: 2rem;
            border-radius: 16px;
            scroll-margin-top: 20px;
        }

        .user-query-bubble {
            align-self: flex-end;
            background: var(--accent-blue);
            padding: 12px 20px;
            border-radius: 18px 18px 0 18px;
            max-width: 70%;
            font-size: 0.95rem;
            margin-right: 7.5%;
            scroll-margin-top: 20px;
        }

        .explanation-box {
            background: rgba(59, 130, 246, 0.05);
            padding: 18px;
            border-radius: 8px;
            border-left: 4px solid var(--accent-blue);
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
            color: #e2e8f0;
            line-height: 1.6;
        }

        .sql-box {
            background: #000;
            padding: 18px;
            border-radius: 8px;
            border-left: 4px solid #4ade80;
            margin-bottom: 1.5rem;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.95rem;
            color: #4ade80;
            line-height: 1.6;
            overflow-x: auto;
        }

        .data-table-wrapper {
            overflow-x: auto;
            border-radius: 8px;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            color: #e2e8f0;
        }

        .data-table th {
            text-align: left;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid var(--border-glass);
            color: var(--primary-gold);
            text-transform: uppercase;
        }

        .data-table td {
            padding: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .chat-wrapper {
            flex-shrink: 0;
            padding: 1.5rem 10% 2.5rem;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: linear-gradient(to top, var(--bg-dark) 80%, transparent);
        }

        .input-container {
            display: flex;
            gap: 12px;
        }

        .chat-input {
            flex: 1;
            background: #111;
            border: 1px solid #222;
            padding: 16px;
            border-radius: 10px;
            color: white;
            font-size: 0.95rem;
            outline: none;
        }

        .chat-input:focus {
            border-color: var(--primary-gold);
        }

        .btn-run {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 0 35px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
        }

        .loading-dots {
            color: var(--primary-gold);
            font-size: 0.85rem;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <div class="profile-section">
            <div class="user-avatar" id="user-initials">?</div>
            <div class="user-details">
                <span id="user-email-display">user@rupeek.com</span>
                <span onclick="logout()" class="logout-link">Logout</span>
            </div>
        </div>

        <button class="btn-new-analysis" onclick="window.location.reload()">+ New Analysis</button>
        <div class="history-label">History</div>
        <div id="history-list"></div>
    </div>

    <div class="main-content">
        <header class="main-header">
            <img src="logo.png" alt="Rupeek" class="rupeek-logo">
        </header>

        <div id="conversation-container">
            <div class="welcome-box" id="welcome-box">
                <h1 id="welcome-message">👋 Hey! Welcome to Rupeek Explorer AI</h1>
                <p style="color: #94a3b8; margin: 0; font-size: 0.95rem;">Explore your business data and get answers you can trust.</p>
            </div>
        </div>

        <div class="chat-wrapper">
            <div id="loading" class="loading-dots" style="display: none;">Generating Response...</div>
            <div class="input-container">
                <input type="text" class="chat-input" id="chat-input" placeholder="Ask a question about our business data.">
                <button class="btn-run" onclick="handleRun()">Run</button>
            </div>
        </div>
    </div>

    <script>
        // LOGOUT FUNCTIONALITY
        function logout() {
            localStorage.removeItem('access_token');
            localStorage.removeItem('user_email');
            window.location.href = 'login.html'; // app.html and login.html are in the same folder
        }

        function loadUser() {
            const email = localStorage.getItem('user_email');
            if (email) {
                document.getElementById('user-email-display').innerText = email;
                const firstName = email.split('@')[0].split('.')[0];
                const formattedName = firstName.charAt(0).toUpperCase() + firstName.slice(1);
                document.getElementById('welcome-message').innerHTML = `👋 Hey ${formattedName}! Welcome to Rupeek Explorer AI`;
                document.getElementById('user-initials').innerText = firstName.charAt(0).toUpperCase();
            }
            document.getElementById('chat-input').focus();
        }

        document.getElementById('chat-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleRun();
        });

        async function handleRun() {
            const input = document.getElementById('chat-input');
            const question = input.value.trim();
            if (!question) return;

            const token = localStorage.getItem('access_token');
            if (!token) { logout(); return; }

            const interactionId = 'chat-' + Date.now();

            // Add to Sidebar History
            const historyList = document.getElementById('history-list');
            const historyItem = document.createElement('div');
            historyItem.className = 'history-item';
            historyItem.innerText = question;
            historyItem.title = question;
            historyItem.onclick = () => {
                document.getElementById(interactionId).scrollIntoView({ behavior: 'smooth' });
            };
            historyList.prepend(historyItem);

            // Add to Chat Window
            const container = document.getElementById('conversation-container');
            const userBubble = document.createElement('div');
            userBubble.className = 'user-query-bubble';
            userBubble.id = interactionId;
            userBubble.innerText = question;
            container.appendChild(userBubble);
            
            input.value = '';
            document.getElementById('loading').style.display = 'block';
            container.scrollTop = container.scrollHeight;

            try {
                const askRes = await fetch('/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ question: question, include_explanation: true })
                });

                const askData = await askRes.json();
                if (!askRes.ok) throw new Error(askData.detail || 'Failed');

                const resultDiv = document.createElement('div');
                resultDiv.className = 'results-section';
                
                let contentHtml = '';
                if (askData.explanation) {
                    contentHtml += `<div class="explanation-box"><strong>Insight:</strong><br>${askData.explanation.replace(/\n/g, '<br>')}</div>`;
                }
                contentHtml += `<div class="sql-box">${askData.sql}</div>`;
                contentHtml += `<div class="table-container" id="table-${askData.request_id}">Running query...</div>`;
                
                resultDiv.innerHTML = contentHtml;
                container.appendChild(resultDiv);
                container.scrollTop = container.scrollHeight;

                const runRes = await fetch('/run_sql', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ request_id: askData.request_id, sql: askData.sql })
                });

                const runData = await runRes.json();
                const tableTarget = document.getElementById(`table-${askData.request_id}`);
                
                if (!runRes.ok) {
                    tableTarget.innerHTML = `<p style="color:#ef4444">Error: ${runData.detail}</p>`;
                } else {
                    renderTable(runData, tableTarget);
                }

            } catch (err) {
                const errorDiv = document.createElement('div');
                errorDiv.className = 'results-section';
                errorDiv.innerHTML = `<p style="color:#ef4444">Error: ${err.message}</p>`;
                container.appendChild(errorDiv);
            } finally {
                document.getElementById('loading').style.display = 'none';
                container.scrollTop = container.scrollHeight;
                input.focus();
            }
        }

        function renderTable(response, targetElement) {
            if (!response.data || response.data.length === 0) {
                targetElement.innerHTML = '<p style="color: #94a3b8; text-align: center;">No data found.</p>';
                return;
            }
            let html = '<div class="data-table-wrapper"><table class="data-table"><thead><tr>';
            response.columns.forEach(col => html += `<th>${col}</th>`);
            html += '</tr></thead><tbody>';
            response.data.forEach(row => {
                html += '<tr>';
                response.columns.forEach(col => html += `<td>${row[col] === null ? '-' : row[col]}</td>`);
                html += '</tr>';
            });
            html += '</tbody></table></div>';
            targetElement.innerHTML = html;
        }

        window.onload = loadUser;
    </script>
</body>

</html>
